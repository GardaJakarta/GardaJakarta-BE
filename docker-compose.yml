name: gardajakarta-local
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gardajakarta
      POSTGRES_USER: postgres
      # Local-only database, not published to the host.
      POSTGRES_PASSWORD: postgres
    volumes:
      - gardajakarta-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gardajakarta"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    init: true
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gardajakarta?schema=public
      NODE_ENV: development
      PORT: 4000
      BETTER_AUTH_URL: http://localhost:${API_PORT:-4000}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-4173} http://localhost:5173
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes:
      - gardajakarta-credentials:/app/secrets
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  frontend:
    profiles: ["app"]
    build:
      context: ../GardaJakarta-FE
      dockerfile: docker/Dockerfile
      args:
        VITE_API_URL: http://localhost:${API_PORT:-4000}/api
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-4173}:4173"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  gardajakarta-db:
  gardajakarta-credentials:
